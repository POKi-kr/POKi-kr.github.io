<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단어 읽어주기</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf8f5;--fg:#222;--card:#fff;--mut:#777;--ac:#c0392b;--bd:#e3ded6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181818;--fg:#eee;--card:#242424;--mut:#999;--ac:#e8806f;--bd:#3a3a3a}}
:root[data-theme="dark"]{--bg:#181818;--fg:#eee;--card:#242424;--mut:#999;--ac:#e8806f;--bd:#3a3a3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{position:relative;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Noto Sans KR","Noto Sans JP",sans-serif;padding:16px;max-width:520px;margin:0 auto}
#tabs{display:flex;align-items:flex-end;gap:2px;margin:10px 0 0;padding:0 4px;border-bottom:1px solid var(--bd)}
.tab{border:1px solid var(--bd);border-bottom:none;border-radius:10px 10px 0 0;padding:9px 16px;font-size:14px;color:var(--mut);cursor:pointer;white-space:nowrap;user-select:none}
.tab.on{background:var(--card);color:var(--fg);font-weight:700;position:relative;top:1px;border-bottom:1px solid var(--card)}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px 16px;text-align:center}
#ck{position:absolute;top:12px;left:12px;width:26px;height:26px;margin:0;accent-color:#27ae60;cursor:pointer}
#jp{font-size:44px;font-weight:700}
#rd{font-size:18px;color:var(--mut);margin-top:6px;min-height:1.5em;line-height:1.5em}
#ko{font-size:24px;margin-top:14px;color:#27ae60}
#cnt{font-size:13px;color:var(--mut);margin-top:14px}
.row{display:flex;gap:8px;margin-top:12px}
button{flex:1;padding:14px 8px;font-size:16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button.p{background:#27ae60;color:#fff;border:none;font-weight:700}
.row button{display:flex;align-items:center;justify-content:center;gap:6px;height:52px;padding:0 6px;font-size:14px;white-space:nowrap}
button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
label{display:block;font-size:13px;color:var(--mut);margin-top:14px}
input[type=range]{width:100%;accent-color:#27ae60}
#msg{font-size:13px;color:var(--mut);margin-top:10px}
#gear{position:absolute;top:24px;right:16px;z-index:41;width:40px;height:40px;padding:0;flex:none;display:flex;align-items:center;justify-content:center;border-radius:10px}
#setp{position:absolute;top:70px;right:16px;z-index:40;width:min(300px,calc(100% - 32px));box-sizing:border-box;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px 18px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#setp[hidden]{display:none}
#lbox{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:16px;z-index:35;flex-direction:column;align-items:flex-end;gap:8px}
#lbox #ltop,#lbox #lbot{align-self:flex-start}
#lbox button{flex:none;height:44px;padding:0 16px;border-radius:22px;display:flex;align-items:center;gap:6px;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.35);font-size:14px;white-space:nowrap}
#setx{flex:none;width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:8px}
#list{margin-top:14px;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
#list[hidden]{display:none}
.it{padding:12px 14px;border-bottom:1px solid var(--bd);font-size:15px}
.it:last-child{border-bottom:none}
.it.pl{background:rgba(22,101,52,.4)}
.pos{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:8px;white-space:nowrap;font-weight:600}
.pos:empty{display:none}
.pv{background:rgba(42,125,225,.15);color:#2a7de1}
.pa{background:rgba(230,126,34,.15);color:#e67e22}
.pn{background:rgba(39,174,96,.15);color:#27ae60}
.pb{background:rgba(155,89,182,.15);color:#9b59b6}
.po{background:rgba(128,128,128,.18);color:var(--mut)}
</style>
</head>
<body>
<button id="gear" aria-label="설정"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37 1 .608 2.296.07 2.572-1.065z"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0-6 0"/></svg></button>
<div id="tabs" role="tablist"></div>
<div style="height:12px"></div>
<div id="vinfo" style="font-size:12px;color:var(--mut);margin:0 0 8px"></div>
<div class="card">
  <input type="checkbox" id="ck" aria-label="외운 단어로 체크" title="외운 단어">
  <div id="jp">—</div>
  <div id="rd"></div>
  <div style="margin-top:8px"><span id="pos" class="pos" style="margin-left:0"></span></div>
  <div id="ko"></div>
  <div id="cnt"></div>
  <div style="margin-top:10px"><button id="say" aria-label="한 번 듣기" style="flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:14px;width:auto"></button></div>
</div>
<div class="row">
  <button id="prev" aria-label="이전"></button>
  <button id="play" class="p" aria-label="자동 재생"></button>
  <button id="next" aria-label="다음"></button>
</div>
<div class="row">
  <button id="shuf" aria-label="섞기"></button>
  <button id="lst" aria-label="단어 목록"></button>
</div>
<div id="list" hidden></div>
<label>단어 수 (1~<span id="mx">44</span>)
  <input type="number" id="num" min="1" max="44" value="20" inputmode="numeric" style="width:100%;box-sizing:border-box;padding:12px;font-size:16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg)">
</label>
<div id="setp" hidden>
  <div style="display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px"><span>설정</span><button id="setx" aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></button></div>
  <label>음량 <span id="vv">100%</span>
    <input type="range" id="vol" min="0" max="1" step="0.1" value="1">
  </label>
  <label>속도 <span id="rv">0.8</span>
    <input type="range" id="rate" min="0.5" max="1.2" step="0.1" value="0.8">
  </label>
  <label style="display:flex;align-items:center;gap:8px;color:var(--fg);font-size:14px;margin-top:16px"><input type="checkbox" id="kk" checked style="width:20px;height:20px;accent-color:#27ae60">한국어 뜻 듣기</label>
  <div style="display:flex;gap:8px;margin-top:16px">
    <button id="addf" style="flex:1;padding:10px 8px;font-size:14px">단어 파일 추가</button>
    <button id="delt" style="flex:1;padding:10px 8px;font-size:14px">현재 탭 삭제</button>
  </div>
  <button id="rest" style="width:100%;margin-top:8px;padding:10px 8px;font-size:14px">기본 단어 복원</button>
  <div style="font-size:12px;color:var(--mut);margin-top:10px;line-height:1.5">txt 한 줄에 일본어|읽기|뜻 (4번째 칸에 품사 선택). UTF-8로 저장해 주세요.</div>
  <input type="file" id="wfile" accept=".txt,text/plain" style="display:none">
</div>
<label style="display:flex;align-items:center;gap:8px;color:var(--fg);font-size:14px"><input type="checkbox" id="ax" style="width:20px;height:20px;accent-color:#27ae60">한 번 들은 단어 빼기</label>
<div id="msg"></div>
<div id="lbox" style="display:none"><button id="ltop" aria-label="맨 위로"></button><button id="lbot" aria-label="맨 아래로"></button><button id="lclose" aria-label="목록 닫기"></button></div>

<script>
var W=[];
var order=W.map(function(_,i){return i}),idx=0,auto=false,timer=null,voices=[],n=20,lim=20,known={},base=order.slice();
var $=function(i){return document.getElementById(i)};
var synth=window.speechSynthesis;

function loadVoices(){voices=synth?synth.getVoices():[];
  var ja=!!pick("ja");
  var ko=!!pick("ko");
  $("msg").textContent=(!synth)?"이 브라우저는 음성 읽기를 지원하지 않아요.":
    (voices.length&&(!ja||!ko))?"기기에 "+(!ja?"일본어 ":"")+(!ko?"한국어 ":"")+"음성이 없어 읽기가 안 될 수 있어요. 기기 설정에서 음성을 추가해 주세요.":"";
  var vj=pick("ja"),vk=pick("ko");$("vinfo").textContent=synth?"음성: 일본어 "+(vj?vj.name:"없음")+" / 한국어 "+(vk?vk.name:"없음"):"";}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices;}

function pick(lang){var re=lang==="ja"?/japan|日本|kyoko|otoya|haruka|ichiro|ayumi|sayaka/i:/korea|한국|yuna|sora|heami/i;
  return voices.find(function(v){return v.lang.replace("_","-").toLowerCase().indexOf(lang)==0})||voices.find(function(v){return re.test(v.name)});}
function speak(text,lang,cb){
  var u=new SpeechSynthesisUtterance(text);u.lang=lang;
  var v=pick(lang.slice(0,2));if(v)u.voice=v;
  u.rate=parseFloat($("rate").value);u.volume=parseFloat($("vol").value);
  u.onend=cb||null;u.onerror=function(e){if(e&&(e.error==="interrupted"||e.error==="canceled"))return;
    if(lang==="ja-JP")$("msg").textContent="일본어 음성을 재생하지 못했어요 ("+((e&&e.error)||"오류")+"). 기기에 일본어 음성이 설치돼 있는지 확인해 주세요.";
    if(cb)cb();};
  try{synth.resume();}catch(e){}
  synth.speak(u);
}
function show(){pvI=-1;$("ck").style.visibility="visible";$("ck").checked=false;var w=W[order[idx]];
  $("jp").textContent=w[0];$("rd").textContent=w[1]!==w[0]?w[1]:"";
  $("ko").textContent=w[2];$("cnt").textContent=autoX?Math.min(heard+1,lim)+" / "+lim:(idx+1)+" / "+n;setPos(w);}
function say(done){
  if(!synth||!n){return}
  if(autoX&&heard>=lim){heard=0;loadVoices();rebuild();if(!n)return;}
  var cur=pvI>=0?pvI:order[idx],isPv=pvI>=0;synth.cancel();var w=W[cur],wi=cur,tok=++sayTok;
  speak(w[1],"ja-JP",function(){
    setTimeout(function(){if(tok!==sayTok)return;speakKo(w[2].split(" / ")[0],function(){
      setTimeout(function(){if(tok!==sayTok)return;markP(wi);
        if(autoX&&!isPv&&heard<lim&&!known[wi]&&!heardW[wi]){heard++;heardW[wi]=1;saveH();skipAdv=!!done;if(heard<lim){rebuild();upd();syncList();}
          if(heard>=lim){stop();upd();syncList();$("msg").textContent="지정한 "+lim+"개를 모두 들었어요. 자동 재생을 다시 누르면 다음 단어로 이어서 시작해요.";return;}}
        if(done)done();},done?1200:0);});},400);
  });
}
function go(d){if(!n)return;idx=(idx+d+n)%n;show();}
function loop(){if(!auto)return;say(function(){if(auto){if(skipAdv)skipAdv=false;else go(1);loop();}});}
function stop(){auto=false;setIc($("play"),"play","자동 재생");$("play").style.background="";if(synth)synth.cancel();}

$("next").onclick=function(){stop();go(1);say();};
$("prev").onclick=function(){stop();go(-1);say();};
$("say").onclick=function(){stop();say();};
$("play").onclick=function(){
  if(auto){stop();return;}
  auto=true;setIc($("play"),"pause","멈춤");$("play").style.background="#166534";loop();};
$("shuf").onclick=function(){stop();
  for(var i=base.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=base[i];base[i]=base[j];base[j]=t;}
  idx=0;sortMode="none";posSort=-1;scriptSort=0;rebuild();syncList();};
$("rate").oninput=function(){$("rv").textContent=this.value;};
$("vol").oninput=function(){$("vv").textContent=Math.round(this.value*100)+"%";try{localStorage.setItem("n5vol",this.value)}catch(e){}};
try{var sv=localStorage.getItem("n5vol");if(sv!==null){$("vol").value=sv;$("vv").textContent=Math.round(sv*100)+"%";}}catch(e){}
function rebuild(){order=base.filter(function(i){return !known[i]&&!heardW[i]});
  n=Math.min(lim,order.length);
  if(!n){$("jp").textContent=W.length?"완료":"단어 없음";$("rd").textContent="";$("ko").textContent=W.length?"모든 단어를 외웠어요!":"단어 파일(txt)을 추가해 주세요";$("cnt").textContent="";$("pos").textContent="";idx=0;stop();$("ck").style.visibility="hidden";return;}
  if(idx>=n)idx=0;show();}
function saveK(){try{localStorage.setItem(KEY("k"),JSON.stringify(Object.keys(known)))}catch(e){}}
function loadK(){try{var a=JSON.parse(localStorage.getItem(KEY("k"))||"[]");a.forEach(function(k){known[k]=1;});}catch(e){}}
function upd(){var h=$("kc");if(!h)return;
  h.style.cssText="display:flex;justify-content:space-between;align-items:center;gap:8px";h.textContent="";
  var s=document.createElement("span");s.textContent="✅ 외운 단어 "+Object.keys(known).length+"개 · 체크하면 학습에서 빠져요";
  var r=document.createElement("button");r.textContent="초기화";r.style.cssText="flex:none;padding:6px 12px;font-size:13px";
  r.onclick=function(){if(!r.dataset.c){r.dataset.c="1";r.textContent="정말 초기화?";r.style.background="#c0392b";r.style.color="#fff";
    setTimeout(function(){r.dataset.c="";r.textContent="초기화";r.style.background="";r.style.color="";},3000);return;}
    stop();heard=0;loadVoices();Object.keys(known).forEach(function(k){delete known[k]});saveK();
    document.querySelectorAll("#list input[type=checkbox]").forEach(function(c){c.checked=false});rebuild();upd();};
  h.appendChild(s);h.appendChild(r);}
function pv(i){stop();if(!synth)return;pvI=i;$("ck").style.visibility="visible";$("ck").checked=!!known[i];var w=W[i];
  $("jp").textContent=w[0];$("rd").textContent=w[1]!==w[0]?w[1]:"";$("ko").textContent=w[2];$("cnt").textContent="목록에서 듣기";setPos(w);
  speak(w[1],"ja-JP",function(){setTimeout(function(){speakKo(w[2].split(" / ")[0],function(){markP(i);});},400);});}
var OTH="ここ そこ あそこ どこ こちら そちら あちら どちら こっち そっち あっち どっち この その あの どの これ それ あれ どれ こんな どう どうぞ どうも なぜ 誰 どなた 何 何～ いつ いくつ いくら いかが はい いいえ ええ さあ そう それでは では また もっと 少し ちょっと すぐ すぐに ゆっくり ゆっくりと よく 沢山 多分 全部 みんな もしもし 下さい 初めて 丁度 時々 段々 一番 大きな 小さな まっすぐ".split(" ");
var NA="好き 嫌い 嫌 綺麗 静か 有名 便利 丈夫 大丈夫 大切 大変 上手 下手 元気 結構 大好き 同じ にぎやか りっぱ 暇 色々".split(" ");
var VB="する できる かかる かける つける かぶる はく やる コピーする".split(" ");
var NN="お手洗い 近く".split(" ");
var ORD=["동사","い형용사","な형용사","명사","대명사","부사","연체사","감탄·접속사","접미사"],OM={};
function addM(c,s){s.split(" ").forEach(function(k){OM[k]=c});}
addM("대명사","ここ そこ あそこ どこ こちら そちら あちら どちら こっち そっち あっち どっち これ それ あれ どれ 誰 どなた 何 いつ いくつ いくら");
addM("연체사","この その あの どの こんな 大きな 小さな 何～");
addM("부사","すぐ すぐに ゆっくり ゆっくりと よく 少し ちょっと もっと 沢山 多分 全部 初めて 丁度 時々 段々 一番 まっすぐ どう なぜ そう いかが");
addM("감탄·접속사","はい いいえ ええ さあ もしもし どうも どうぞ 下さい それでは では また");
function posOf(w){var k=w[0],r=w[1];if(w[3]&&ORD.indexOf(w[3])>=0)return w[3];
  var m=OM[k];if(m)return m;
  if(k.charAt(0)==="～")return "접미사";
  if(NA.indexOf(k)>=0)return "な형용사";
  if(VB.indexOf(k)>=0)return "동사";
  if(NN.indexOf(k)>=0)return "명사";
  var last=k.charAt(k.length-1),kana=/[\u3041-\u3096]/.test(last),hasK=/[\u4e00-\u9fff]/.test(k);
  if(kana&&last==="い"&&r.slice(-1)==="い")return "い형용사";
  if(kana&&hasK&&/[うくぐすつぬぶむる]$/.test(last)&&!/^[一二三四五六七八九十]つ$/.test(k))return "동사";
  return "명사";}
function posC(p){return p==="동사"?"pv":p==="い형용사"?"pa":p==="な형용사"?"pb":p==="명사"?"pn":"po";}
function setPos(w){var p=posOf(w),e=$("pos");e.textContent=p;e.className="pos "+posC(p);}
var TABS=[],LV=null;
function loadTabs(){try{TABS=JSON.parse(localStorage.getItem("vocTabs")||"[]");}catch(e){TABS=[];}}
function saveTabs(){try{localStorage.setItem("vocTabs",JSON.stringify(TABS));return true;}catch(e){$("msg").textContent="저장 공간이 부족해서 저장하지 못했어요.";return false;}}
function delTab(id){if(id.indexOf("d_")===0){var dl=delList();if(dl.indexOf(id)<0)dl.push(id);saveDel(dl);}try{["k","h","p"].forEach(function(x){localStorage.removeItem(id+"_"+x)});}catch(e){}
  TABS=TABS.filter(function(x){return x.id!==id});saveTabs();$("setp").hidden=true;switchLevel(TABS[0]?TABS[0].id:null);}
function delList(){try{return JSON.parse(localStorage.getItem("vocDelDef")||"[]");}catch(e){return [];}}
function saveDel(a){try{localStorage.setItem("vocDelDef",JSON.stringify(a));}catch(e){}}
function loadDefaults(manual){
  if(!window.fetch){return;}
  fetch("words/index.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(list){
    var del=delList(),jobs=[],ids=list.map(function(it){return "d_"+it.file});
    list.forEach(function(it){var id="d_"+it.file;
      if(TABS.some(function(x){return x.id===id})||del.indexOf(id)>=0)return;
      jobs.push(fetch("words/"+it.file,{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(t){
        var w=parseWords(t);return w.length?{id:id,name:it.name||it.file.replace(/\.[^.]+$/,""),words:w}:null;}).catch(function(){return null;}));});
    return Promise.all(jobs).then(function(res){var add=res.filter(Boolean);
      if(!add.length){if(manual)$("msg").textContent="추가할 기본 단어가 없어요.";return;}
      TABS=TABS.concat(add);
      TABS.sort(function(a,b){var x=ids.indexOf(a.id),y=ids.indexOf(b.id);if(x<0&&y<0)return 0;if(x<0)return 1;if(y<0)return -1;return x-y;});
      if(!saveTabs())return;
      if(!LV&&TABS.length)switchLevel(TABS[0].id);else renderTabs();
      if(manual)$("msg").textContent="기본 단어 "+add.length+"개 탭을 복원했어요.";});
  }).catch(function(){if(manual)$("msg").textContent="기본 단어 파일을 불러오지 못했어요. words 폴더와 index.json을 확인해 주세요.";});
}
